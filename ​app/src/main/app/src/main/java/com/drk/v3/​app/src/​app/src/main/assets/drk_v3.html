<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRK v3 - AI Image Generator</title>
    <style>
        :root {
            --primary: #BB86FC;
            --background: #121212;
            --surface: #1E1E1E;
            --text: #FFFFFF;
            --text-secondary: #AAAAAA;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #2D2D2D;
            border: 1px solid #444;
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            box-sizing: border-box;
        }
        .ratio-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .ratio-btn {
            background-color: #2D2D2D;
            border: 1px solid #444;
            color: var(--text);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
        .ratio-btn.active {
            background-color: rgba(187, 134, 252, 0.2);
            border-color: var(--primary);
            color: var(--primary);
        }
        .slider-group {
            margin-bottom: 20px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }
        .generate-btn {
            width: 100%;
            background-color: var(--primary);
            color: var(--background);
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .result-container {
            display: none;
            text-align: center;
        }
        .result-image {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .save-btn {
            background-color: #2D2D2D;
            color: var(--text);
            border: 1px solid var(--primary);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .loading {
            display: none;
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DRK v3</h1>
        <div class="input-group">
            <label for="prompt">ప్రాంప్ట్ నమోదు చేయండి...</label>
            <input type="text" id="prompt" placeholder="ఎగిరే కారు...">
        </div>
        <div class="input-group">
            <label for="negPrompt">నెగటివ్ ప్రాంప్ట్...</label>
            <input type="text" id="negPrompt" placeholder="తక్కువ నాణ్యత, అస్పష్టమైన...">
        </div>
        <div class="ratio-group">
            <button class="ratio-btn" onclick="setRatio('9:16')">9:16</button>
            <button class="ratio-btn active" onclick="setRatio('1:1')">1:1</button>
            <button class="ratio-btn" onclick="setRatio('16:9')">16:9</button>
        </div>
        <div class="slider-group">
            <div class="slider-header">
                <span>దశలు (Steps)</span>
                <span id="stepsValue">20</span>
            </div>
            <input type="range" id="steps" min="20" max="50" value="20" oninput="updateSteps()">
        </div>
        <div class="slider-group">
            <div class="slider-header">
                <span>CFG</span>
                <span id="cfgValue">7.5</span>
            </div>
            <input type="range" id="cfg" min="1" max="15" step="0.1" value="7.5" oninput="updateCfg()">
        </div>
        <div class="input-group">
            <label for="seed">సీడ్ (Seed) -1 అనగా రాండమ్</label>
            <input type="text" id="seed" value="-1">
        </div>
        <button class="generate-btn" id="generateBtn" onclick="generateImage()">సృష్టించు</button>
        <div class="loading" id="loadingText">చిత్రాన్ని సృష్టిస్తోంది దయచేసి వేచి ఉండండి...</div>
        <div class="result-container" id="resultContainer">
            <img src="" alt="Generated Image" class="result-image" id="resultImage">
            <button class="save-btn" onclick="saveImage()">గ్యాలరీలో సేవ్ చేయండి</button>
        </div>
    </div>
    <script>
        let currentRatio = '1:1';
        function setRatio(ratio) {
            currentRatio = ratio;
            document.querySelectorAll('.ratio-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText === ratio) {
                    btn.classList.add('active');
                }
            });
        }
        function updateSteps() {
            document.getElementById('stepsValue').innerText = document.getElementById('steps').value;
        }
        function updateCfg() {
            document.getElementById('cfgValue').innerText = document.getElementById('cfg').value;
        }
        function generateImage() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) {
                alert('దయచేసి ప్రాంప్ట్ నమోదు చేయండి!');
                return;
            }
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loadingText');
            const result = document.getElementById('resultContainer');
            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            setTimeout(() => {
                btn.disabled = false;
                loading.style.display = 'none';
                result.style.display = 'block';
                const img = document.getElementById('resultImage');
                let width = 512, height = 512;
                if(currentRatio === '9:16') { width = 360; height = 640; }
                if(currentRatio === '16:9') { width = 640; height = 360; }
                img.src = `https://via.placeholder.com/${width}x${height}/2D2D2D/BB86FC?text=Generated+Image`;
            }, 2000);
        }
        function saveImage() {
            alert('చిత్రం సేవ్ చేయబడింది! (ఇది కేవలం డెమో)');
        }
    </script>
</body>
</html>
