name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Fix All Files
      run: |
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "rootProject.name = 'DRK_v3_App'" >> settings.gradle
        echo "include ':app'" >> settings.gradle
        
        echo "buildscript {" > build.gradle
        echo "    repositories {" >> build.gradle
        echo "        google()" >> build.gradle
        echo "        mavenCentral()" >> build.gradle
        echo "    }" >> build.gradle
        echo "    dependencies {" >> build.gradle
        echo "        classpath 'com.android.tools.build:gradle:8.1.0'" >> build.gradle
        echo "        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'" >> build.gradle
        echo "    }" >> build.gradle
        echo "}" >> build.gradle
        echo "allprojects {" >> build.gradle
        echo "    repositories {" >> build.gradle
        echo "        google()" >> build.gradle
        echo "        mavenCentral()" >> build.gradle
        echo "    }" >> build.gradle
        echo "}" >> build.gradle
        
        mkdir -p app
        echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" > app/build.gradle
        echo "android { namespace 'com.drk.v3'; compileSdk 34; defaultConfig { applicationId 'com.drk.v3'; minSdk 29; targetSdk 34; versionCode 1; versionName '1.0' } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } kotlinOptions { jvmTarget = '17' } }" >> app/build.gradle
        echo "dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.webkit:webkit:1.8.0' }" >> app/build.gradle
        
        mkdir -p app/src/main
        echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.drk.v3"><application android:label="DRK v3"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

    - name: Build APK directly with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DRK_v3_App
        path: app/build/outputs/apk/debug/app-debug.apk
